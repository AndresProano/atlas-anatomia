<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef2f6">
  <title>Atlas Anatómico 3D</title>
  <meta name="description" content="Atlas 3D del cuerpo humano para estudiantes de medicina, con datos abiertos (BodyParts3D, HuBMAP, Z-Anatomy, Wikipedia).">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230d9488'/><circle cx='16' cy='9' r='4' fill='white'/><rect x='12' y='14' width='8' height='12' rx='3' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=60749a66">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js"
    }
  }
  </script>
</head>
<body data-mode="body">
  <!-- Visor 3D a pantalla completa -->
  <main class="stage" id="stage">
    <canvas id="canvas" aria-label="Modelo 3D del cuerpo humano"></canvas>
    <div class="hover-label" id="hover-label" hidden></div>
  </main>

  <!-- Buscador flotante -->
  <header class="top">
    <div class="search-pill" id="search-pill">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Buscar estructura…" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="search-clear" aria-label="Borrar búsqueda" hidden>
        <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <ul id="search-results" class="results" hidden></ul>
    </div>
    <div class="sex-top" id="body-sex" role="group" aria-label="Cuerpo masculino o femenino">
      <button data-sex="M" class="active" aria-label="Cuerpo masculino" title="Cuerpo masculino">♂</button>
      <button data-sex="F" aria-label="Cuerpo femenino" title="Cuerpo femenino">♀</button>
    </div>
    <button class="round" id="theme-btn" aria-label="Cambiar tema">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
    </button>
  </header>

  <!-- Herramientas flotantes -->
  <div class="tools" id="tools">
    <button class="round" id="view-btn" aria-label="Girar vista" title="Girar vista">
      <svg class="ico" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
    </button>
    <button class="round" id="clip-btn" aria-label="Corte" title="Corte">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="M8.5 8.5 20 18M8.5 15.5 20 6"/></svg>
    </button>
    <button class="round" id="show-all" aria-label="Mostrar todo" title="Mostrar todo lo oculto" hidden>
      <svg class="ico" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <!-- Navegación: zoom y flechas (mantener pulsado para seguir moviendo) -->
    <div class="navpad" id="navpad" aria-label="Navegación">
      <button class="nav-btn" data-zoom="0.85" aria-label="Acercar" title="Acercar (+)"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="nav-btn" data-zoom="1.1765" aria-label="Alejar" title="Alejar (−)"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <div class="dpad">
        <button class="nav-btn up" data-pan="0,1" aria-label="Mover arriba" title="Arriba (↑)"><svg class="ico" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
        <button class="nav-btn left" data-pan="-1,0" aria-label="Mover a la izquierda" title="Izquierda (←)"><svg class="ico" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
        <button class="nav-btn right" data-pan="1,0" aria-label="Mover a la derecha" title="Derecha (→)"><svg class="ico" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
        <button class="nav-btn down" data-pan="0,-1" aria-label="Mover abajo" title="Abajo (↓)"><svg class="ico" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
    </div>
  </div>

  <!-- Corte -->
  <div class="pop" id="clip-pop" hidden>
    <div class="seg" id="clip-axis">
      <button data-axis="sagital">Sagital</button>
      <button data-axis="coronal">Coronal</button>
      <button data-axis="axial">Axial</button>
    </div>
    <input id="clip-pos" type="range" min="0" max="1" step="0.001" value="0.5" aria-label="Posición del corte">
    <button class="link" id="clip-off">Quitar corte</button>
  </div>

  <!-- Capas (cuerpo) / órganos (HuBMAP) -->
  <div class="dock">
    <div class="chips" id="layers"></div>
    <div class="organ-bar" id="organ-bar" hidden>
      <div class="sex" id="sex-filter">
        <button data-sex="F" class="active" aria-label="Femenino">♀</button>
        <button data-sex="M" aria-label="Masculino">♂</button>
      </div>
      <div class="chips" id="organ-chips"></div>
    </div>
  </div>

  <!-- Ficha de la estructura (hoja inferior en móvil, tarjeta en escritorio) -->
  <section class="sheet" id="sheet" hidden aria-live="polite">
    <button class="handle" id="sheet-handle" aria-label="Expandir ficha"></button>
    <button class="round close" id="sheet-close" aria-label="Cerrar ficha">
      <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div id="sheet-body"></div>
  </section>

  <!-- Quiz -->
  <section class="sheet quiz" id="quiz-box" hidden></section>

  <!-- Fuentes -->
  <article class="page" id="sources-page" hidden></article>

  <!-- Carga y avisos -->
  <div class="loader" id="loader"><div class="bar"><span id="loader-bar"></span></div><p id="loader-text">Cargando…</p></div>
  <div class="toast" id="toast" hidden></div>

  <!-- Barra de pestañas -->
  <nav class="tabbar" role="tablist">
    <button class="tab active" data-mode="body" role="tab">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2.5"/><path d="M12 8v7M7 10h10M12 15l-3 6M12 15l3 6"/></svg>
      <span>Cuerpo</span>
    </button>
    <button class="tab" data-mode="organs" role="tab">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>
      <span>Órganos</span>
    </button>
    <button class="tab" data-mode="quiz" role="tab">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg>
      <span>Quiz</span>
    </button>
    <button class="tab" data-mode="sources" role="tab">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h6"/></svg>
      <span>Fuentes</span>
    </button>
  </nav>

  <script>window.ATLAS_V = '60749a66';</script>
  <script type="module" src="js/main.js?v=60749a66"></script>
</body>
</html>
